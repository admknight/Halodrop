# Builds the Windows installer and publishes it to GitHub Releases.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
#
# Output (build/build-installer.ps1): Halodrop-<version>-win-Setup.exe (Filee's own installer, src/Filee.Setup),
# Halodrop-<version>-win-Portable.zip and Halodrop-<version>-SHA256SUMS.txt for x64, and for Windows on ARM64 (#236), built
# and tested on an ARM64 runner, Halodrop-<version>-win-arm64-Setup.exe and -win-arm64-Portable.zip. Their hashes go into
# the same Halodrop-<version>-SHA256SUMS.txt (sign-release.ps1): Filee 2.4.0 and older take the last Windows-looking
# SHA256SUMS file of a release, so a separate ARM64 one would break their updates.
# The release is a draft with the Linux and macOS packages: the Windows files are signed on a PC signed in to Certum's
# SimplySign cloud (its key needs a phone token), so this run keeps the tested, unsigned builds as the artifacts
# windows-unsigned and windows-arm64-unsigned, and build/sign-release.ps1 signs them, packs both Setups again, uploads
# the Windows files and publishes. The draft waits for both Windows builds, so a release never lacks one of them.
# The SHA256SUMS files are signed there too, with the update key that never leaves that PC: it uploads a .sig next to
# every SHA256SUMS file of the release (the Linux and macOS ones drafted here as well), and official builds refuse an
# update without one.
# Release notes: the version's section of CHANGELOG.md (what changed, for people using Filee), then the list GitHub
# generates from the pull requests merged since the previous release, grouped by label (.github/release.yml), with
# their authors and new contributors.
# Large engines are not in the installer; its engine page (or the app, on first run and in Settings > Engines)
# downloads them.
#
# Morph change: Windows x64 first. Until Morph has its own code-signing certificate and update key, the x64 job builds
# and tests the installer and portable zip, and the publish job releases them straight away, unsigned. Linux, macOS
# and Windows ARM64 run only when the repository variable OTHER_PLATFORMS is "true"; then the release is a draft
# for build/sign-release.ps1, as in Filee.
name: Release

on:
  push:
    tags: ['v*']
  # Morph change: or by hand, from Actions → Release → Run workflow, with the version's tag (v0.7.0): the publish job
  # creates the tag on the commit it built.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish, like v0.7.0'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  portable:
    if: ${{ vars.OTHER_PLATFORMS == 'true' }}
    uses: ./.github/workflows/portable.yml
    with:
      version: ${{ inputs.tag || github.ref_name }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Fonts
        shell: pwsh
        run: ./build/fetch-fonts.ps1

      - name: Restore Zig toolchain
        uses: actions/cache/restore@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      # Windows 11 top-level Explorer menu: FileeExplorerMenu.dll (C, built with a pinned Zig toolchain) and the
      # unsigned sparse package FileeExplorerMenu.msix. Built before the tests so they check the real files.
      - name: Build Explorer menu extension
        shell: pwsh
        run: ./build/build-explorer-menu.ps1 -Version ${{ steps.version.outputs.value }}

      # Same engines as CI, so the release runs the same tests (they are not part of the installer).
      - name: Fetch rhwp, Pandoc and 7-Zip for engine tests
        shell: pwsh
        run: ./build/fetch-engines.ps1 -Only rhwp,pandoc,7zip

      # Built first and tested like CI: the UI tests on their own with crash and hang blame (a crash names the
      # running test and leaves a dump in TestResults), then the rest.
      - name: Build
        run: dotnet build Filee.slnx -c Release

      # Morph change: a commit CI already passed on Windows x64 (the build and every UI part that ran) isn't tested
      # again, so the release takes minutes instead of over an hour. Any other commit is tested here as before.
      - name: Already tested by CI?
        id: tested
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tested = $false
          $runs = gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=completed&per_page=20" | ConvertFrom-Json
          foreach ($run in $runs.workflow_runs | Where-Object conclusion -eq 'success') {
            $jobs = (gh api "repos/${{ github.repository }}/actions/runs/$($run.id)/jobs?per_page=100" | ConvertFrom-Json).jobs
            $build = $jobs | Where-Object { $_.name -eq 'windows / build (win-x64)' -and $_.conclusion -eq 'success' }
            $badUi = $jobs | Where-Object { $_.name -like 'windows / ui (win-x64*' -and $_.conclusion -notin 'success', 'skipped' }
            if ($build -and -not $badUi) { $tested = $true; Write-Host "Tested by CI run $($run.html_url)"; break }
          }
          if (-not $tested) { Write-Host 'No passing CI run for this commit: testing here.' }
          "value=$($tested.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Test UI on its own
        if: steps.tested.outputs.value != 'true'
        run: dotnet test tests/Filee.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        if: steps.tested.outputs.value != 'true'
        run: dotnet test Filee.slnx --no-build -c Release --filter "FullyQualifiedName!~Filee.App.Tests"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: TestResults/
          if-no-files-found: ignore

      # Publishes the app (Release, self-contained, ReadyToRun) with the Explorer menu extension and the bundled rhwp
      # and 7-Zip and the Microsoft C++ runtime, publishes Setup (one self-contained file), appends the app to it as a
      # checked payload and zips the portable copy.
      - name: Build installer and portable zip
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Portable

      # The publish folder and the Setup program as tested, for build/sign-release.ps1 (artifacts leave out hidden
      # folders such as build/.cache, so both are moved into one folder first).
      - name: Keep the unsigned Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Move-Item publish/win-x64 unsigned/app
          Copy-Item build/.cache/setup/Halodrop.Setup.exe unsigned/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

      # Morph change: the finished x64 files (Setup, portable zip, SHA256SUMS) for the publish job.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: Releases/Halodrop-*
          if-no-files-found: error
          retention-days: 30

  # Windows on ARM64, built and tested natively like CI's build (win-arm64) job: the app, Setup, the Explorer menu DLL,
  # 7-Zip, rhwp and Unhwp's library are ARM64 builds (rhwp and Unhwp from the pins in build/fetch-engines.ps1).
  windows-arm64:
    needs: portable
    if: ${{ vars.OTHER_PLATFORMS == 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: version
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      # CI builds without them (and skips their tests); a release doesn't.
      - name: ARM64 pins
        run: |
          $missing = @(./build/fetch-engines.ps1 -Runtime win-arm64 -MissingPins)
          if ($missing) { throw "Not pinned for win-arm64: $($missing -join ', ') (build/fetch-engines.ps1)." }

      - name: Fonts
        run: ./build/fetch-fonts.ps1

      # Unhwp's library goes next to the test programs through the build.
      - name: Fetch engines for engine tests
        run: ./build/fetch-engines.ps1 -Runtime win-arm64 -Only pandoc,7zip,rhwp,unhwp

      - name: Build
        run: |
          dotnet build Filee.slnx -c Release "-p:UnhwpNativeLibrary=$((Resolve-Path engines/unhwp/unhwp.dll).Path)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The x64 Zig toolchain CI's build job saves; it cross-compiles the ARM64 DLL under x64 emulation.
      - name: Restore Zig toolchain
        uses: actions/cache/restore@v5
        with:
          path: build/.cache/zig-x86_64-windows-0.16.0
          key: zig-0.16.0-x86_64-windows

      - name: Build Explorer menu extension
        timeout-minutes: 30
        run: ./build/build-explorer-menu.ps1 -Architecture arm64 -Version ${{ steps.version.outputs.value }}

      - name: Test UI on its own
        run: dotnet test tests/Filee.App.Tests --no-build -c Release --blame-crash --blame-hang-timeout 5m --logger "console;verbosity=normal" --results-directory TestResults/app

      - name: Test
        run: dotnet test Filee.slnx --no-build -c Release --filter "FullyQualifiedName!~Filee.App.Tests" --logger "trx" --results-directory TestResults

      # Setup around a stub app, installed, updated and uninstalled in a sandbox: the PC that signs the release is
      # x64 and can't run the ARM64 Setup.
      - name: Check the installer
        run: ./build/build-installer.ps1 -CheckOnly -Runtime win-arm64

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-arm64
          path: TestResults/
          if-no-files-found: ignore

      - name: Build installer and portable zip
        run: ./build/build-installer.ps1 -Version ${{ steps.version.outputs.value }} -Runtime win-arm64 -Portable

      # Laid out like windows-unsigned, for build/sign-release.ps1.
      - name: Keep the unsigned Windows ARM64 build
        run: |
          New-Item -ItemType Directory -Force -Path unsigned | Out-Null
          Move-Item publish/win-arm64 unsigned/app
          Copy-Item build/.cache/setup/Halodrop.Setup.exe unsigned/

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: [portable, windows, windows-arm64]
    if: ${{ vars.OTHER_PLATFORMS == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Download Linux and macOS packages
        uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          merge-multiple: true
          path: Releases

      - name: Draft the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          # Linux and macOS only: build/sign-release.ps1 adds the signed Windows files. The ARM64 build's own sums file
          # never ships (its hashes go into Halodrop-<version>-SHA256SUMS.txt).
          $windows = "Halodrop-$version-win-Setup.exe", "Halodrop-$version-win-Portable.zip", "Halodrop-$version-SHA256SUMS.txt",
            "Halodrop-$version-win-arm64-Setup.exe", "Halodrop-$version-win-arm64-Portable.zip", "Halodrop-$version-win-arm64-SHA256SUMS.txt"
          $files = Get-ChildItem Releases -File -Filter "Halodrop-$version-*" | Where-Object Name -notin $windows | ForEach-Object FullName
          # "## 1.4.0" up to the next "## " heading of CHANGELOG.md, without the heading itself.
          $changes = ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($changelog -match "(?ms)^## $([regex]::Escape($version))[ \t]*\r?\n(.*?)(?=^## |\z)") {
            # One line per list item: GitHub shows the line breaks of the 120-column file in release notes. Indented
            # lines continue the item above, unless they start a nested item ("  - "), which keeps its own line.
            $changes = $Matches[1].Trim() -replace '\r?\n +(?!- |\* |\d+\. )(?=\S)', ' '
          }
          if (-not $changes) { Write-Warning "CHANGELOG.md has no section for $version" }

          # GitHub's generated notes: the merged pull requests (one list instead of its label headings, which would
          # repeat the CHANGELOG's), new contributors and the full changelog link.
          $generated = (gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name='${{ inputs.tag || github.ref_name }}' | ConvertFrom-Json).body
          $prs = @()
          if ($generated -match "(?ms)^## What's Changed[ \t]*\r?\n(.*?)(?=^## |^\*\*Full Changelog|\z)") {
            $prs = @($Matches[1] -split '\r?\n' | Where-Object { $_ -match '^\* ' })
          }
          $tail = if ($generated -match "(?ms)(^## New Contributors.*|^\*\*Full Changelog.*)") { $Matches[1].Trim() } else { '' }

          $parts = @("## What's Changed")
          if ($changes) { $parts += $changes }
          if ($prs.Count) { $parts += "### Pull requests`n`n" + ($prs -join "`n") }
          if ($tail) { $parts += $tail }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile ($parts -join "`n`n") -Encoding utf8
          gh release create '${{ inputs.tag || github.ref_name }}' --draft --title "Halodrop $version" --notes-file $notesFile --verify-tag @files

  # Morph change: Windows x64 only, published as tested (unsigned) with the version's CHANGELOG.md section as notes.
  publish:
    needs: windows
    if: ${{ vars.OTHER_PLATFORMS != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: Releases

      # Halodrop change: the SHA256SUMS file is signed with Halodrop's update key (repository secret MORPH_UPDATE_KEY,
      # the PEM of the private key). Official builds carry the public half and refuse an update without the .sig.
      - name: Sign the checksums
        env:
          MORPH_UPDATE_KEY_PEM: ${{ secrets.MORPH_UPDATE_KEY }}
        shell: pwsh
        run: |
          $public = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.MorphUpdatePublicKey | Where-Object { $_ } | Select-Object -First 1
          if (-not $public) { Write-Host 'No update key in Directory.Build.props: checksums are not signed.'; return }
          if (-not $env:MORPH_UPDATE_KEY_PEM) { throw 'Directory.Build.props carries an update key, but the MORPH_UPDATE_KEY secret is missing: updates from this release would be refused.' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'update-key.pem'
          try {
            Set-Content -LiteralPath $keyFile -Value $env:MORPH_UPDATE_KEY_PEM -NoNewline
            ./build/sign-checksums.ps1 -Folder Releases -PrivateKeyPath $keyFile -PublicKey $public
          }
          finally { Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue }

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          $changes = ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          if ($changelog -match "(?ms)^## $([regex]::Escape($version))[ \t]*\r?\n(.*?)(?=^## |\z)") {
            $changes = $Matches[1].Trim() -replace '\r?\n +(?!- |\* |\d+\. )(?=\S)', ' '
          }
          if (-not $changes) { throw "CHANGELOG.md has no section for $version" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content $notesFile "## What's Changed`n`n$changes" -Encoding utf8
          $files = Get-ChildItem Releases -File | ForEach-Object FullName
          gh release create '${{ inputs.tag || github.ref_name }}' --target '${{ github.sha }}' --title "Halodrop $version" --notes-file $notesFile @files
