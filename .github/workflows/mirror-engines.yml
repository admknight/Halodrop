# Halodrop: keeps Halodrop's own copy of every engine download pinned in engines.json, in the "engines" release of this
# repository, one asset per file named by its SHA-256. EngineInstaller falls back to it when an engine's own site fails
# (an old version taken down, or a site that can't be reached from someone's network). Each file is checked against its
# pinned SHA-256 here, and again by Halodrop when it downloads.
name: Mirror engines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/Filee.Engines/Infrastructure/engines.json']

permissions:
  contents: write

concurrency:
  group: mirror-engines
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Make sure the engines release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view engines >/dev/null 2>&1 || gh release create engines --prerelease --title "Engine downloads (mirror)" \
            --notes "Halodrop's copy of the engine downloads it offers, each named by its SHA-256. Halodrop uses these only when an engine's own site fails; install Halodrop from the latest release instead."

      - name: Copy every pinned download that isn't there yet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, subprocess, urllib.request
          data = json.load(open("src/Filee.Engines/Infrastructure/engines.json"))
          wanted = {}
          def add(components):
              for c in (components or {}).values():
                  if isinstance(c, dict) and c.get("url") and c.get("sha256"):
                      wanted[c["sha256"].lower()] = c["url"]
          add(data.get("components"))
          for platform in (data.get("platforms") or {}).values():
              add(platform.get("components") if isinstance(platform, dict) else None)
          have = set(json.loads(subprocess.check_output(["gh", "release", "view", "engines", "--json", "assets", "--jq", "[.assets[].name]"])))
          failed = []
          for sha, url in sorted(wanted.items()):
              if sha in have:
                  continue
              print(f"{sha[:12]}  {url}", flush=True)
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Halodrop engine mirror"})
                  digest = hashlib.sha256()
                  with urllib.request.urlopen(request, timeout=300) as response, open(sha, "wb") as out:
                      while chunk := response.read(1 << 20):
                          digest.update(chunk); out.write(chunk)
                  if digest.hexdigest() != sha:
                      raise ValueError(f"SHA-256 is {digest.hexdigest()}")
                  subprocess.check_call(["gh", "release", "upload", "engines", sha, "--clobber"])
              except Exception as error:
                  print(f"  failed: {error}", flush=True)
                  failed.append(url)
              finally:
                  if os.path.exists(sha):
                      os.remove(sha)
          print(f"{len(wanted)} pinned, {len(failed)} failed")
          if failed:
              raise SystemExit("Not mirrored: " + ", ".join(failed))
